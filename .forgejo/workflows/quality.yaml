name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: barrettruth/canola.nvim
          ref: canola
          path: _canola
      - name: Format
        run: nix develop .#ci --command just format

  lint:
    name: Lint
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: barrettruth/canola.nvim
          ref: canola
          path: _canola
      - name: Lint
        run: nix develop .#ci --command just lint

  test:
    name: Test
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: barrettruth/canola.nvim
          ref: canola
          path: _canola
      - name: Test
        run: nix develop .#ci --command just test
